[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A small GPT-style LLM built from scratch, stage by stage."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy",
    "pyyaml",
    "tqdm",
    "regex",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
